# Fetches openly licensed listing photos (the dev container cannot reach image hosts).
# Editing tools/image-queries.json -> builds contact sheets in tools/candidates/.
# Editing tools/image-picks.json   -> downloads the picks into site/assets/img/.
name: images
on:
  push:
    paths: ["tools/image-queries.json", "tools/image-picks.json", "tools/fetch_images.py", "tools/iitd-sources.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==11.0.0
      - name: Pick mode from what changed
        id: mode
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          if echo "$changed" | grep -q image-picks.json; then echo "mode=final" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -q iitd-sources.json; then echo "mode=iitd" >> "$GITHUB_OUTPUT"
          else echo "mode=candidates" >> "$GITHUB_OUTPUT"; fi
      - run: python tools/fetch_images.py ${{ steps.mode.outputs.mode }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each folder separately: one missing path makes a combined `git add` add nothing.
          for d in tools/candidates site/assets/img; do if [ -d "$d" ]; then git add -A "$d"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "images: ${{ steps.mode.outputs.mode }} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
