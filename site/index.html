<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IITD Live</title>
  <meta name="description" content="Every IIT Delhi event in one feed. See what's on tonight, register in one tap, keep your QR pass in a wallet, and get live venue updates.">
  <meta name="theme-color" content="#8A1538" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1116" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IITD Live">
  <meta property="og:title" content="IITD Live: what's on at IIT Delhi">
  <meta property="og:description" content="Tonight at IITD, this week's events and every fest. One-tap registration, team invites and a QR pass wallet.">
  <meta property="og:url" content="https://banthia14aman.github.io/IIT-Delhi-Live/">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script type="module" src="js/ui.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-skip>Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="IITD Live, home">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">IITD <b>Live</b></span>
      </a>

      <form class="search" role="search" id="search-form">
        <label class="visually-hidden" for="search">Search events and clubs</label>
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" name="q" type="search" placeholder="Search events, clubs" autocomplete="off" enterkeyhint="search">
      </form>

      <nav class="topnav" aria-label="Primary">
        <a href="#/" data-nav="explore">Explore</a>
        <a href="#/?tab=fests" data-nav="fests">Fests</a>
        <a href="#/wallet" data-nav="wallet">Wallet</a>
        <a href="#/org" data-nav="org" data-nav-org>Organise</a>
      </nav>

      <a class="account" id="account" href="#/login">Log in</a>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <div id="app" class="view" aria-live="off">
      <p class="boot">Loading events…</p>
    </div>
  </main>

  <footer class="footer">
    <p><span class="footer__dot" aria-hidden="true"></span> Demo mode: data stays in your browser.</p>
    <p class="footer__sub">A class project for IIT Delhi. Not an official institute service.</p>
  </footer>

  <nav class="tabbar" aria-label="Primary">
    <a href="#/" data-nav="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg>
      <span>Explore</span>
    </a>
    <a href="#/?tab=fests" data-nav="fests">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V4.5"/><path d="M5 5h11.5l-2 3.5 2 3.5H5"/></svg>
      <span>Fests</span>
    </a>
    <a href="#/wallet" data-nav="wallet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5V6.5a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1v2a2 2 0 0 0 0 4v0a2 2 0 0 0 0 4v1.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1V16.5a2 2 0 0 0 0-4 2 2 0 0 0 0-4z"/><path d="M14.5 6v12" stroke-dasharray="1.5 2"/></svg>
      <span>Wallet</span>
    </a>
    <a href="#/onboarding" data-nav="me" id="tab-me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.75"/><path d="M4.5 20c.9-3.6 3.9-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
